# Tests for the pipeline and the web app. The site itself is published from the gh-pages branch
# (the contents of web/dist), so that it never depends on a CI run.
# SI disclosure: written with the help of an SI coding assistant (Claude), checked by the team.
name: CI

# Run by hand from the Actions tab ("Run workflow"). Automatic runs on every push are switched
# off for now; to switch them back on, add "push:" and "pull_request:" under "on:".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: pipeline
        run: |
          uv venv --python 3.12
          uv pip install -e . pytest ruff matplotlib
      - name: Lint
        working-directory: pipeline
        run: uv run ruff check src scripts tests
      - name: Test (offline)
        working-directory: pipeline
        run: uv run pytest -q -m "not network"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint, test, build
        working-directory: web
        run: |
          npm run lint
          npm test
          npm run build
