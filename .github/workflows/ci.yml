# Tests for the pipeline and the web app, and deployment of the static site to GitHub Pages.
# SI disclosure: written with the help of an SI coding assistant (Claude), checked by the team.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        working-directory: pipeline
        run: |
          uv venv --python 3.12
          uv pip install -e . pytest ruff matplotlib
      - name: Lint
        working-directory: pipeline
        run: uv run ruff check src scripts tests
      - name: Test (offline)
        working-directory: pipeline
        run: uv run pytest -q -m "not network"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint, test, build
        working-directory: web
        run: |
          npm run lint
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [pipeline, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
