[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "parallax-spherex"
version = "1.0.0"
description = "ParallaX: chromatic-corrected blink comparator and moving-object explorer for NASA's SPHEREx all-sky spectral survey."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Abed El Rahmane Jaafir" },
  { name = "Mohamad Alayli" },
]
keywords = ["astronomy", "SPHEREx", "infrared", "time-domain", "moving objects", "NASA Space Apps"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "astropy>=6.1",
  "httpx>=0.27",
  "pillow>=10.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "typer>=0.12",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.9"]

[project.scripts]
parallax = "parallax.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "matplotlib>=3.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "NPY"]
ignore = ["E501", "B008", "RUF046", "RUF007", "C408"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: tests that call live NASA/IPAC or JPL services (deselected by default)",
]

[tool.coverage.run]
source = ["parallax"]
branch = true
